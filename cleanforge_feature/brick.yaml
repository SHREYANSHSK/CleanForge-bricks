name: cleanforge_feature
description: Adds a new feature module to a CleanForge-generated Flutter project, with automatic route addition. Reads project name and state management from .cleanforge/config.json.
version: 0.1.0+1
environment:
  mason: ^0.1.1
vars:
  feat:
    type: string
    description: The name of the feature (e.g., auth)
    default: new_feature
    prompt: What is the feature name?
