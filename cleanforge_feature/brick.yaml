name: cleanforge_feature
description: Adds a new feature module to a CleanForge-generated Flutter project, with automatic route addition.
version: 1.0.1+1
repository: https://github.com/SHREYANSHSK/CleanForge-bricks

environment:
  mason: ^0.1.1
vars:
  feat:
    type: string
    description: The name of the feature (e.g., auth)
    default: new_feature
    prompt: What is the feature name?
