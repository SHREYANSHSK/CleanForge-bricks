name: cleanforge
description: Generates a Flutter project with clean architecture, supporting selectable state management (GetX for now), including data, domain, presentation layers, and packages like dio, logger, dartz.


# The following defines the brick repository url.
# Uncomment and update the following line before publishing the brick.
# repository: https://github.com/my_org/my_repo

# The following defines the version and build number for your brick.
# A version number is three numbers separated by dots, like 1.2.34
# followed by an optional build number (separated by a +).
version: 0.1.0+1

# The following defines the environment for the current brick.
# It includes the version of mason that the brick requires.
environment:
  mason: ^0.1.1

vars:
  mode:
    type: enum
    description: Choose operation mode
    values:
      - new_project
      - existing_project
    default: new_project
    prompt: Is this a new project or existing project?


  # Dont set the default to some value until logic changed in hooks, let it be empty if you dont know what you are doing
  project_name:
    type: string
    description: Name of the project (use lowercase_with_underscore)
    prompt: "Enter your project name (press Enter to use current directory for existing project):"
    default: ""


  # Dont set the default to some value until logic changed in hooks, let it be empty if you dont know what you are doing
  package_name:
    type: string
    description: Package name for imports (auto-detected)
    default: ""
    prompt: "Enter your package name (press Enter for auto detection):"


  org:
    type: string
    description: Organization name (e.g., com.example)
    prompt: What is your organization name? (press enter for existing project or use default)
    default: com.example

  description:
    type: string
    description: A brief description of your project
    prompt: Describe your project (optional)
    default: A new Flutter project using Clean Architecture

  state_management:
    type: enum
    description: Choose state management
    values:
      - getx
    default: getx
    prompt: "Choose state management:"